syntax = "proto3";

package raven.v1;

option go_package = "github.com/srl-labs/raven/gen/raven/v1;ravenv1";

// ─── Services ───

service RouteService {
  // Query routes from the route table with optional filters.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);

  // One-shot validation of a prefix against current RPKI state.
  rpc ValidatePrefix(ValidatePrefixRequest) returns (ValidatePrefixResponse);

  // Stream validation state changes in real time.
  rpc WatchRoutes(WatchRoutesRequest) returns (stream WatchRoutesResponse);
}

service StatusService {
  // System health: BMP peers, RTR caches, uptime.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // List all BMP peers with session metadata.
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
}

service AuditService {
  // Run a read-only security posture audit for a specific router.
  rpc AuditRouter(AuditRouterRequest) returns (AuditRouterResponse);
}

// ─── Route Messages ───

message RouteFilter {
  string prefix = 1;           // e.g. "1.0.0.0/24" — empty means no filter
  uint32 origin_asn = 2;       // 0 means no filter
  string peer = 3;             // peer address — empty means no filter
  string posture = 4;          // security posture filter — empty means no filter
  string afi = 5;              // "ipv4", "ipv6" — empty means both
  // RIBs to list: adj-rib-in-pre (or pre-policy), adj-rib-in-post (or
  // post-policy), loc-rib, adj-rib-out-pre, adj-rib-out-post. Empty means the
  // default view: adj-rib-in-pre and loc-rib.
  repeated string ribs = 6;
  // How prefix matches: "exact" (or empty, the default), "covering" (the
  // prefix and every less specific prefix covering it) or "longer" (the
  // prefix and every more specific prefix within it).
  string match = 7;
}

message RouteEntry {
  string prefix = 1;
  string peer_addr = 2;
  uint32 peer_asn = 3;
  repeated uint32 as_path = 4;
  uint32 origin_asn = 5;
  string next_hop = 6;
  string rov_state = 7;        // "Valid", "Invalid", "NotFound"
  string aspa_state = 8;       // "Valid", "Invalid", "Unknown", "Unverifiable"
  string security_posture = 9; // "secured", "origin-only", etc.
  string rov_reason = 10;
  repeated VRPEntry matched_vrps = 11;
  ASPADetail aspa_detail = 12;
  int64 timestamp_unix = 13;
  // The customer→provider hop that made ASPA Invalid: customer_asn's ASPA
  // does not list provider_asn. Set only when aspa_state is "Invalid" and a
  // hop accounts for it (a neighbor-AS check failure has none).
  ASPAHopEntry aspa_failing_hop = 14;
  string rib = 15;                // "adj-rib-in-pre", "adj-rib-in-post", "loc-rib", "adj-rib-out-pre", "adj-rib-out-post"
  string peer_type = 16;          // BMP peer type: "global", "rd", "local", "loc-rib"
  string peer_distinguisher = 17; // the peer's VRF RD ("65000:1", "192.0.2.1:7", "65000L:1"); empty for a global peer
  // Why the route has its rov_state: "valid", "not_found", "invalid_length",
  // "invalid_origin", "invalid_as0" or "invalid_as_set". Empty for a route
  // restored from a snapshot and not yet revalidated.
  string rov_reason_code = 18;
  // The VRPs covering the route, split as Routinator's validity API does,
  // looked up when the route is listed.
  ROVVRPs rov_vrps = 19;
  // The VRP rov_reason names; unset for "not_found".
  VRPEntry rov_deciding_vrp = 20;
  repeated string communities = 21;       // RFC 1997, "65535:666"
  repeated string large_communities = 22; // RFC 8092, "6695:1911:172"
}

message VRPEntry {
  string prefix = 1;
  uint32 asn = 2;
  uint32 max_length = 3;
}

// The VRPs covering a route. matched: the route's origin AS, maxLength at
// least its prefix length. unmatched_as: another AS (AS0 included; every VRP
// when the origin is NONE or unknown). unmatched_length: the route's origin
// AS, maxLength shorter than its prefix. Each list holds at most 16 entries;
// a list cut short has its full length in the matching _count field, which
// is 0 otherwise.
message ROVVRPs {
  repeated VRPEntry matched = 1;
  repeated VRPEntry unmatched_as = 2;
  repeated VRPEntry unmatched_length = 3;
  uint32 matched_count = 4;
  uint32 unmatched_as_count = 5;
  uint32 unmatched_length_count = 6;
}

message ASPADetail {
  string procedure = 1;        // "upstream" or "downstream"
  repeated ASPAHopEntry hops = 2;
}

message ASPAHopEntry {
  uint32 customer_asn = 1;
  uint32 provider_asn = 2;
  string authorization = 3;    // "Authorized", "NotAuthorized", "NoASPA", "Skipped"
}

// ─── ListRoutes ───

message ListRoutesRequest {
  RouteFilter filter = 1;
  string format = 2;          // "table", "json", "wide" — server hint for response detail
}

message ListRoutesResponse {
  repeated RouteEntry routes = 1;
  uint64 total_count = 2;
}

// ─── ValidatePrefix ───

message ValidatePrefixRequest {
  string prefix = 1;
  uint32 origin_asn = 2;
  // For one-shot mode (no daemon): connect to this RTR cache directly
  string rtr_address = 3;
}

message ValidatePrefixResponse {
  RouteEntry result = 1;
}

// ─── WatchRoutes ───

message WatchRoutesRequest {
  RouteFilter filter = 1;
}

message WatchRoutesResponse {
  RouteEntry route = 1;
  string change_type = 2;     // "new", "update", "withdraw"
  string previous_posture = 3; // for updates: what the posture was before
}

// ─── Status ───

message GetStatusRequest {}

message GetStatusResponse {
  string version = 1;
  int64 uptime_seconds = 2;
  repeated BMPPeerStatus bmp_peers = 3;
  repeated RTRCacheStatus rtr_caches = 4;
  RouteTableStats route_table = 5;
}

message BMPPeerStatus {
  string address = 1;
  uint32 asn = 2;
  string router_id = 3;
  string state = 4;            // "up", "down"
  uint64 route_count = 5;
  int64 uptime_seconds = 6;
  int64 last_message_unix = 7;
  string peer_type = 8;          // BMP peer type: "global", "rd", "local", "loc-rib"
  string peer_distinguisher = 9; // the peer's VRF RD; empty for a global peer
  string table_name = 10;        // a Loc-RIB instance's VRF/Table Name (RFC 9069), when its Peer Up gave one
}

message RTRCacheStatus {
  string address = 1;
  string state = 2;            // "connected", "disconnected", "syncing"
  uint32 protocol_version = 3; // 1 or 2
  uint64 vrp_count = 4;
  uint64 aspa_count = 5;
  uint32 serial = 6;
  int64 last_sync_unix = 7;
}

message RouteTableStats {
  uint64 total_routes = 1;                   // routes in the default view
  map<string, uint64> routes_by_posture = 2; // posture → count, in the default view
  map<string, uint64> routes_by_afi = 3;     // "ipv4"/"ipv6" → count
  repeated string default_view = 4;          // the RIBs of the default view: "adj-rib-in-pre", "loc-rib"
  map<string, uint64> routes_by_rib = 5;     // RIB → count, every RIB
}

// ─── ListPeers ───

message ListPeersRequest {}

message ListPeersResponse {
  repeated BMPPeerStatus peers = 1;
}

// ─── AuditRouter ───

message AuditRouterRequest {
  string router_id = 1; // router ID (IP address) to audit
  string rib = 2;       // RIB to audit: "adj-rib-in-pre" (default; or "pre-policy"), "adj-rib-in-post" (or "post-policy"), "loc-rib", ...
}

message PeerAuditEntry {
  string peer_addr = 1;
  uint32 peer_asn = 2;
  int32 total_routes = 3;
  map<string, int32> posture_summary = 4;
  double rov_coverage = 5;
  double aspa_coverage = 6;
  string peer_distinguisher = 7; // the peer's VRF RD; empty for a global peer
  string router = 8;             // the monitored router (its BMP session address)
}

message OffenderEntry {
  uint32 origin_asn = 1;
  int32 count = 2;
  string posture = 3;
  repeated string prefixes = 4;
}

message AuditRouterResponse {
  string router_id = 1;
  int64 generated_at_unix = 2;
  int32 total_routes = 3;
  double rov_coverage = 4;
  double aspa_coverage = 5;
  map<string, int32> posture_summary = 6;
  repeated PeerAuditEntry peers = 7;
  repeated OffenderEntry top_offenders = 8;
  repeated string recommendations = 9;
  string rib = 10; // the one RIB audited
}
