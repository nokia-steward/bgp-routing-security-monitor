[project]
site_name = "RAVEN"
site_description = "Ravens see what you can't. Documentation for RAVEN (bgp-routing-security-monitor) — BMP + RPKI ROV + ASPA path validation in a single binary."
site_url = "https://nokia-steward.github.io/bgp-routing-security-monitor/"
repo_url = "https://github.com/nokia-steward/bgp-routing-security-monitor"
repo_name = "nokia-steward/bgp-routing-security-monitor"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/install.md" },
    { "Quick Start" = "getting-started/quick-start.md" },
    { "Concepts" = "getting-started/concepts.md" },
  ] },
  { "User Guide" = [
    { "Configuration" = "user-guide/configuration.md" },
    { "CLI Reference" = "user-guide/cli-reference.md" },
    { "Security Postures" = "user-guide/security-postures.md" },
    { "Loc-RIB Monitoring" = "user-guide/loc-rib.md" },
    { "Observability & Metrics" = "user-guide/observability.md" },
    { "Active Response" = "user-guide/active-response.md" },
  ] },
  { "Demo Lab" = [
    { "Overview" = "lab/overview.md" },
    { "Attack Scenarios" = "lab/scenarios.md" },
    { "Loc-RIB Lab" = "lab/loc-rib.md" },
  ] },
  { "Deployment" = [
    { "Production Setup" = "deployment/production.md" },
    { "Deployment Hardening" = "deployment/hardening.md" },
    { "Scaling" = "deployment/scaling.md" },
  ] },
  { "Architecture" = [
    { "Data Model" = "architecture/data-model.md" },
    { "Validation Engine" = "architecture/validation-engine.md" },
  ] },
  { "Reference" = [
    { "Telemetry NDJSON" = "reference/telemetry-ndjson.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Changelog" = "CHANGELOG.md" },
]

[project.theme]
variant = "classic"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
]

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
tables = {}

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/nokia-steward/bgp-routing-security-monitor"
